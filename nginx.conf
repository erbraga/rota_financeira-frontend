# Servidor da SPA (dist/), substituindo /etc/nginx/conf.d/default.conf da imagem nginx:alpine. Porta 8080 (não
# 80): o processo roda como o usuário não-root "nginx" (ver Dockerfile), que não pode abrir portas privilegiadas.
server {
    listen 8080;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css text/plain text/javascript application/javascript application/json image/svg+xml;

    # O nginx NÃO herda "add_header" do nível acima para um location que já define o seu próprio "add_header"
    # (é tudo ou nada, por nível): por isso os três cabeçalhos de segurança são repetidos em cada location,
    # junto do Cache-Control específico dele, em vez de ficarem só aqui no nível do server.

    # Os arquivos em assets/ têm hash no nome (ex.: index-a1b2c3.js): uma vez publicados, nunca mudam de
    # conteúdo, então o cache pode ser o mais longo possível.
    location /assets/ {
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # Fallback de SPA: qualquer caminho que não seja um arquivo real (uma rota do React Router, como
    # /simulacoes/1/resultado) cai no index.html, que nunca é cacheado — para uma versão nova publicada ser
    # sempre buscada de novo.
    location / {
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
